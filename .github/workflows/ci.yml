name: CI

on:
  push:
    branches: [feature/pos, master, main, develop]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      # Untuk test grup "mysql" (lock, JSON, constraint) — docs/standards/testing.md §5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: gspos_test
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependency (CVE)
        run: composer audit --no-dev --abandoned=report

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: composer lint

      - name: Larastan
        run: composer analyse

      - name: Pest (SQLite)
        run: php artisan test --exclude-group=mysql

      - name: Pest (MySQL)
        run: php artisan test --group=mysql
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: gspos_test
          DB_USERNAME: root
          DB_PASSWORD: secret
